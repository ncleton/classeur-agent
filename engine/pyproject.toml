[project]
name = "classeur"
version = "0.1.0"
description = "Moteur de tri IA pour Apple Mail : lit, comprend, range et prépare les réponses."
requires-python = ">=3.11"
dependencies = [
    "apple-mailbox-mcp==1.8.2",
    "mcp>=2.2.0,<3",
]

[project.scripts]
classeur = "classeur.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classeur"]
