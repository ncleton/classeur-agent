[project]
name = "classeur"
version = "0.1.0"
description = "Moteur de tri IA pour Apple Mail : lit, comprend, range et prépare les réponses."
requires-python = ">=3.11"
dependencies = [
    "apple-mailbox-mcp==1.8.2",
    "mcp>=2.2.0,<3",
    # cryptography 49+ n'est plus publié précompilé pour les Mac Intel : 48 est la dernière version
    # universelle, et uv.lock la retient pour tous les Mac afin que l'installateur ne compile rien.
    "cryptography<49 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.scripts]
classeur = "classeur.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/classeur"]
